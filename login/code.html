<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - Maritime Prep</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                      "primary-container": "#001f3f",
                      "surface-dim": "#dadadc",
                      "secondary-container": "#4597fe",
                      "on-tertiary-fixed-variant": "#43474b",
                      "tertiary-fixed": "#dfe3e7",
                      "on-surface": "#1a1c1e",
                      "surface-bright": "#f9f9fc",

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        .floating-input:focus + .floating-label,
        .floating-input:not(:placeholder-shown) + .floating-label {
            transform: translateY(-130%) scale(0.85);
            color: #0074D9; /* Action Blue for focus */
        }
        
        /* Focus state overrides */
        .floating-input:focus {
            border-color: #0074D9 !important;
            ring-color: #0074D9 !important;
        }
    </style>

<body class="bg-surface text-on-surface min-h-screen flex items-center justify-center font-body-md selection:bg-secondary-fixed selection:text-on-secondary-fixed p-margin-mobile">
<div class="w-full max-w-md bg-surface-container-lowest border border-outline-variant rounded-xl p-8 shadow-sm">
<!-- Header -->
<div class="text-center mb-8">
<div class="inline-flex items-center justify-center w-12 h-12 bg-primary-container text-on-primary-container rounded-lg mb-4">
<span class="material-symbols-outlined text-[32px]" data-icon="sailing">sailing</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-primary mb-2">Maritime Prep</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Welcome back, Cadet</p>
</div>
<!-- Form -->
<form class="space-y-6">
<!-- Email Input -->
<div class="relative mt-2">
<input class="floating-input block w-full px-4 py-3 bg-surface border border-outline rounded-lg text-on-surface font-body-md focus:outline-none focus:ring-1 focus:border-secondary transition-colors peer placeholder-transparent" id="email" placeholder="Email" required="" type="email"/>
<label class="floating-label absolute text-on-surface-variant duration-300 transform -translate-y-1/2 top-1/2 left-4 z-10 origin-[0] bg-surface px-1 peer-focus:px-1 peer-placeholder-shown:scale-100 peer-placeholder-shown:-translate-y-1/2 peer-placeholder-shown:top-1/2 peer-focus:top-0 peer-focus:scale-85 peer-focus:-translate-y-1/2 font-body-md cursor-text" for="email">
                    Email Address
                </label>
</div>
<!-- Password Input -->
<div class="relative mt-2">
<input class="floating-input block w-full px-4 py-3 bg-surface border border-outline rounded-lg text-on-surface font-body-md focus:outline-none focus:ring-1 focus:border-secondary transition-colors peer placeholder-transparent" id="password" placeholder="Password" required="" type="password"/>
<label class="floating-label absolute text-on-surface-variant duration-300 transform -translate-y-1/2 top-1/2 left-4 z-10 origin-[0] bg-surface px-1 peer-focus:px-1 peer-placeholder-shown:scale-100 peer-placeholder-shown:-translate-y-1/2 peer-placeholder-shown:top-1/2 peer-focus:top-0 peer-focus:scale-85 peer-focus:-translate-y-1/2 font-body-md cursor-text" for="password">
                    Password
                </label>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-on-surface-variant hover:text-on-surface" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility_off">visibility_off</span>
</button>
</div>
<div class="flex items-center justify-end">
<a class="font-label-md text-label-md text-secondary hover:text-primary transition-colors" href="#">Forgot password?</a>
</div>
<!-- Primary Login Button -->
<button class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg text-on-primary bg-[#0074D9] hover:bg-secondary focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-secondary font-label-md text-label-md transition-all shadow-[0_4px_12px_rgba(0,31,63,0.08)]" type="submit">
                Log In
            </button>
</form>
<!-- Divider -->
<div class="mt-8 relative">
<div aria-hidden="true" class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant"></div>
</div>
<div class="relative flex justify-center">
<span class="px-2 bg-surface-container-lowest text-on-surface-variant font-caption text-caption">OR</span>
</div>
</div>
<!-- Social Login -->
<div class="mt-8">
<button class="w-full flex justify-center items-center py-3 px-4 border border-outline-variant rounded-lg text-on-surface bg-surface hover:bg-surface-container-low focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary font-label-md text-label-md transition-colors" type="button">
<svg class="w-5 h-5 mr-2" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                Continue with Google
            </button>
</div>
<!-- Sign Up Link -->
<div class="mt-8 text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                Don't have an account? 
                <a class="font-label-md text-label-md text-primary hover:text-secondary transition-colors underline decoration-secondary/30 underline-offset-4" href="#">Sign up</a>
</p>
</div>
</div>
</body></html>
