name: seaprep_app
description: "SeaPrep Maritime Merchant Navy Interview Pro - Mobile & Web App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  cupertino_icons: ^1.0.6
  supabase_flutter: ^2.8.0
  url_launcher: ^6.2.5
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.jpeg"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/logo.jpeg"
    background_color: "#000613"
    theme_color: "#005EB2"

flutter:
  uses-material-design: true
  assets:
    - assets/logos/
    - assets/logo.jpeg
